services:
  - type: web
    name: pangeaworld-api
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: alembic -c backend/alembic.ini upgrade head
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PANGEAWORLD_ENV
        value: production
      - key: PANGEAWORLD_DATABASE_URL
        sync: false
      - key: PANGEAWORLD_CORS_ORIGINS
        sync: false
      - key: PANGEAWORLD_COOKIE_SECURE
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_ADVISOR_MODEL
        sync: false
      - key: GEMINI_NEWS_MODEL
        sync: false

  - type: web
    name: pangeaworld
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: cron
    name: pangeaworld-keepalive
    runtime: python
    schedule: "*/10 * * * *"
    buildCommand: "true"
    startCommand: python scripts/render_keepalive.py
    envVars:
      - key: PANGEAWORLD_HEALTH_URL
        sync: false

